name: database

networks:
  default:
    external: true
    name: traefik

volumes:
  db:

# [제거됨] redis(pskhome-mem-1)
#
# 기존 Spring 백엔드가 spring-boot-starter-data-redis 를 갖고 있어 함께 띄웠지만
# spring-session-data-redis 가 없어 세션이 Redis 에 저장된 적이 없다.
# 현재 Express 백엔드도 redis 클라이언트 의존성 자체가 없다 (세션은 프로세스 메모리).
# 아무도 쓰지 않으면서 메모리만 잡고 있어 내렸다.
#
# 다시 필요해지면 서비스를 되살리고 backend 에 클라이언트를 붙인다.

services:
  db:
    image: mysql:8.0
    container_name: pskhome-db-1
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_EXPIRE_LOGS_DAYS: 7
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: page
      LANG: C.UTF-8
      TZ: Asia/Seoul
    volumes:
      - db:/var/lib/mysql
      - ../connection:/var/run/mysqld
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
