name: frontend

networks:
  default:
    external: true
    name: traefik

services:
  fe:
    # Next 는 Node 런타임이 필요하므로 nginx 정적 서빙에서 Node 컨테이너로 바뀌었다.
    # 서버에서 직접 빌드한다: `docker compose -f docker-compose-fe.yaml up -d --build`
    build:
      context: ../frontend
      dockerfile: dockerfile
    image: pskhome-fe
    container_name: pskhome-fe-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # 외부 노출 포트(5173)는 기존과 동일하게 유지한다. 컨테이너 내부만 3000 이다.
    ports:
      - 5173:3000
