name: trader

# 자동매매 엔진 (1단계: 가상매매). MySQL 은 새로 띄우지 않고 기존 pskhome-db-1 을 같은 네트워크로 쓴다.
#
# 접속 정보는 같은 폴더의 trader.env 에서 읽는다. 이 파일은 서버에서 직접 만들고 git 에 올리지 않는다.
# (be/fe 배포는 server/.env 를 매번 덮어쓰므로 파일을 분리했다)
#
#   docker compose -f docker-compose-trader.yaml --profile migrate run --rm migrate   # 스키마 적용
#   docker compose -f docker-compose-trader.yaml up -d engine
#   docker compose -f docker-compose-trader.yaml run --rm engine trader halt --reason "..."   # 즉시 중지
#   docker compose -f docker-compose-trader.yaml run --rm engine trader status

networks:
  default:
    external: true
    name: traefik

x-trader: &trader
  image: ghcr.io/elfaka/pskhome-trader:${TRADER_TAG:-latest}
  env_file: trader.env
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  # 외부로 여는 포트는 없다

services:
  engine:
    <<: *trader
    container_name: pskhome-trader-1
    # 기록과 실제가 어긋날 수 있는 오류에서 엔진은 exit 2 로 멈춘다.
    # 재시작되면 recovery 가 DB 와 브로커를 대조하고, 불일치면 킬스위치를 켠 채로 뜬다.
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TRADER_MODE: paper
      TRADER_FEED: synthetic
      TRADER_PACE: realtime
      TRADER_LOG_JSON: "true"
    stop_grace_period: 30s

  migrate:
    <<: *trader
    profiles: ["migrate"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
