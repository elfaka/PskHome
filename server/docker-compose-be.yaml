name: backend

networks:
  default:
    external: true
    name: traefik

services:
  be:
    # Node 앱은 실행에 node_modules 가 필요해 JAR 처럼 산출물만 볼륨으로 물릴 수 없다.
    # 레지스트리 없이 서버에서 직접 빌드한다: `docker compose -f docker-compose-be.yaml up -d --build`
    build:
      context: ../backend
      dockerfile: dockerfile
    image: pskhome-be
    container_name: pskhome-be-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080

      # MySQL (기존 docker-compose-db.yaml 의 pskhome-db-1)
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@pskhome-db-1:3306/page

      # 세션은 프로세스 메모리에 둔다 (기존 Spring 백엔드와 동일).
      # 재배포하면 로그인 세션이 사라지고, 인스턴스를 늘리면 공유되지 않는다.
      SESSION_SECRET: ${SESSION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://elfaka.kr/api/login/oauth2/code/google
      APP_LOGIN_SUCCESS_REDIRECT: http://elfaka.kr/googleform/forms
    ports:
      - 8080:8080
