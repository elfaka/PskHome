name: backend

networks:
  default:
    external: true
    name: traefik

services:
  be:
    # 이미지는 GitHub Actions 에서 빌드해 GHCR 에 올린다. 서버는 pull 만 한다.
    # (예전에는 서버에서 직접 빌드했는데 tsc 가 VPS 메모리를 밀어내 배포가 끊겼다)
    #
    # BE_TAG 는 배포 스크립트가 커밋 SHA 태그로 넘긴다.
    # 서버에서 수동으로 띄울 때는 지정하지 않아도 latest 로 떨어진다.
    image: ghcr.io/elfaka/pskhome-be:${BE_TAG:-latest}
    container_name: pskhome-be-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080

      # MySQL (기존 docker-compose-db.yaml 의 pskhome-db-1)
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@pskhome-db-1:3306/page

      # 세션은 프로세스 메모리에 둔다 (기존 Spring 백엔드와 동일).
      # 재배포하면 로그인 세션이 사라지고, 인스턴스를 늘리면 공유되지 않는다.
      SESSION_SECRET: ${SESSION_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://elfaka.kr/api/login/oauth2/code/google
      APP_LOGIN_SUCCESS_REDIRECT: http://elfaka.kr/googleform/forms
    ports:
      - 8080:8080
