name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/be-cd.yaml
      - server/docker-compose-be.yaml
      - server/docker-compose-db.yaml

# be-cd 와 fe-cd 는 같은 서버에서 docker 이미지를 빌드한다.
# 동시에 돌면 서로의 빌드/이미지를 건드리므로 하나의 그룹으로 묶어 직렬화한다.
# (진행 중인 배포를 취소하면 서버가 어중간한 상태로 남을 수 있어 cancel 하지 않는다)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 22 설치 (+ npm 캐시)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. 의존성 설치
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 4~6. 배포 게이트 — 하나라도 실패하면 배포하지 않는다
      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      # 7. 전송할 소스 정리
      #    이미지는 서버에서 빌드하므로 산출물/의존성은 보낼 필요가 없다.
      - name: Clean workspace before upload
        run: rm -rf backend/node_modules backend/dist

      # 8. 서버의 이전 소스 제거 (삭제된 파일이 남지 않도록)
      #    실패해도 실행 중인 컨테이너는 그대로라 서비스는 유지된다.
      - name: Clear previous backend source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf ~/${{ github.event.repository.name }}/backend

      # 9. 소스 업로드
      - name: Copy source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: backend/, server/
          target: ~/${{ github.event.repository.name }}

      - name: Setup environment variables
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/${{ github.event.repository.name }}/server
            echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      # 10. 이미지 빌드 + 기동
      - name: Update be and db
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/${{ github.event.repository.name }}/server

            docker compose -f docker-compose-db.yaml pull

            docker compose -f docker-compose-be.yaml down
            docker compose -f docker-compose-db.yaml down

            export $(cat .env)

            docker compose -f docker-compose-db.yaml up -d
            docker compose -f docker-compose-be.yaml up -d --build

            docker image prune -f

            STATUS=$(docker inspect -f '{{.State.Status}}' pskhome-be-1)

            if [[ ${STATUS} != "running" ]]; then
              docker logs --tail 100 pskhome-be-1
              exit 1
            fi
