name: Front-End Deploy

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/fe-cd.yaml
      - server/docker-compose-fe.yaml

# 이미지는 Actions 에서 빌드해 GHCR 에 올리고 서버는 pull 만 한다.
# 그래도 be/fe 가 동시에 배포되면 같은 서버에서 compose 가 겹치므로 직렬화한다.
# (진행 중인 배포를 취소하면 서버가 어중간한 상태로 남을 수 있어 cancel 하지 않는다)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# GHCR 에 이미지를 푸시하려면 packages:write 가 필요하다.
permissions:
  contents: read
  packages: write

env:
  # GHCR 이미지 경로. 레지스트리 경로는 소문자만 허용한다 (owner: elfaka).
  IMAGE: ghcr.io/${{ github.repository_owner }}/pskhome-fe

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 22 설치 (+ npm 캐시)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. 의존성 설치
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4~5. 배포 게이트 — 하나라도 실패하면 이미지를 만들지 않는다.
      #      next build 는 아래 이미지 빌드가 그대로 수행하므로 여기서 또 돌리지 않는다.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # 6. 이미지 빌드 + GHCR 푸시
      #    Next 빌드는 이 저장소에서 가장 무거운 작업이다. 예전처럼 서버에서 돌리면
      #    MySQL·백엔드가 함께 떠 있는 VPS 의 메모리를 밀어낸다. 러너로 옮긴다.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          # 배포 서버가 x86_64 라는 전제다. ARM 장비로 옮기면 여기를 함께 바꿔야 한다.
          platforms: linux/amd64
          push: true
          # latest 와 커밋 SHA 태그를 함께 올린다.
          # 배포는 SHA 태그로 고정해 어떤 커밋이 떠 있는지 분명히 한다.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # 레이어 캐시를 Actions 캐시에 둬서 매번 npm ci 부터 다시 하지 않는다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. compose 파일 업로드
      #    이미지는 레지스트리에서 받으므로 애플리케이션 소스는 더 이상 보내지 않는다.
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: server/
          target: ~/${{ github.event.repository.name }}

      # 8. 이미지 내려받고 기동
      - name: Update fe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 서버에서 빌드하지 않으므로 pull 시간만 있으면 된다.
          command_timeout: 10m
          script_stop: true
          envs: GHCR_TOKEN,GHCR_USER,FE_TAG
          script: |
            cd ~/${{ github.event.repository.name }}/server

            # 자원 상태를 남겨 둔다. 배포가 이상하게 끊겼을 때 판단 근거가 된다.
            echo "----- preflight -----"
            free -h || true
            df -h / || true
            docker system df || true
            echo "---------------------"

            # 서버에서 빌드하지 않으므로 예전에 올려 두었던 소스는 필요 없다.
            rm -rf ~/${{ github.event.repository.name }}/frontend

            # 저장소가 비공개면 GHCR 패키지도 비공개다.
            # 워크플로 실행 동안만 유효한 토큰으로 로그인해 장기 PAT 을 서버에 두지 않는다.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # FE_TAG 는 커밋 SHA 태그다. compose 파일에는 ${FE_TAG:-latest} 로 적혀 있어
            # 서버에서 수동으로 띄울 때는 latest 로 떨어진다.
            export FE_TAG
            docker compose -f docker-compose-fe.yaml pull
            docker compose -f docker-compose-fe.yaml up -d

            docker logout ghcr.io

            # 이전 태그의 이미지가 dangling 으로 남는다.
            docker image prune -f

            # 기동 직후에는 아직 starting 일 수 있으므로 잠시 기다린다.
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Status}}' pskhome-fe-1 2>/dev/null || echo missing)
              if [ "$STATUS" = "running" ]; then break; fi
              sleep 2
            done

            if [ "$STATUS" != "running" ]; then
              echo "frontend container is '$STATUS'"
              docker logs --tail 200 pskhome-fe-1 || true

              # 메모리 때문에 죽었는지 바로 구분할 수 있게 함께 남긴다.
              # dmesg 는 커널 설정에 따라 비특권 사용자에게 막혀 있을 수 있다.
              free -h || true
              dmesg -T 2>/dev/null | grep -iE 'out of memory|killed process' | tail -20 || true

              exit 1
            fi

            echo "frontend is running ($FE_TAG)"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FE_TAG: sha-${{ github.sha }}
