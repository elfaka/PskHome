name: Front-End Deploy

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/fe-cd.yaml
      - server/docker-compose-fe.yaml

# be-cd 와 fe-cd 는 같은 서버에서 docker 이미지를 빌드한다.
# 동시에 돌면 서로의 빌드/이미지를 건드리므로 하나의 그룹으로 묶어 직렬화한다.
# (진행 중인 배포를 취소하면 서버가 어중간한 상태로 남을 수 있어 cancel 하지 않는다)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 22 설치 (+ npm 캐시)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. 의존성 설치
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4~6. 배포 게이트 — 하나라도 실패하면 배포하지 않는다
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # 7. 전송할 소스 정리 (이미지는 서버에서 빌드한다)
      - name: Clean workspace before upload
        run: rm -rf frontend/node_modules frontend/.next

      # 8. 서버의 이전 소스 제거 (삭제된 파일이 라우트로 되살아나지 않도록)
      - name: Clear previous frontend source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf ~/${{ github.event.repository.name }}/frontend

      # 9. 소스 업로드
      - name: Copy source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: frontend/, server/
          target: ~/${{ github.event.repository.name }}

      # 10. 이미지 빌드 + 기동
      - name: Update fe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_NAME }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 서버에서 Next 이미지를 직접 빌드하므로 기본 10분으로는 부족하다.
          command_timeout: 30m
          script_stop: true
          script: |
            cd ~/${{ github.event.repository.name }}/server

            # 빌드 전 자원 상태를 남긴다.
            # 서버가 OOM 으로 SSH 세션째 끊기면 이 아래 로그는 남지 않으므로,
            # 끊기기 전에 찍어둔 이 값이 원인 판단의 단서가 된다.
            echo "----- preflight -----"
            free -h || true
            df -h / || true
            docker system df || true
            echo "---------------------"

            # --build 는 이미지가 바뀌면 컨테이너를 알아서 재생성한다.
            # 먼저 down 하지 않으므로 빌드가 실패해도 기존 컨테이너는 계속 떠 있는다.
            #
            # 빌드 로그를 파일에도 남긴다. OOM 으로 SSH 가 끊기면 Actions 로그는
            # 중간에서 잘리지만 서버의 이 파일에는 끝까지 남는다.
            #
            # [주의] tee 를 거치면 파이프라인의 종료코드가 tee 의 것(늘 0)이 되어
            # 빌드 실패를 삼킨다. 그대로 두면 빌드가 깨져도 예전 컨테이너가 떠 있는 한
            # 아래 running 체크를 통과해 배포가 성공으로 보고된다.
            #
            # pipefail 은 dash 에 없어 셸을 가릴 수 없다. 그래서 결과를 파일로 넘기는데,
            # 이때 `cmd; echo $? > f` 형태는 쓸 수 없다 — script_stop(set -e) 이 걸려 있어
            # 빌드가 실패하는 순간 서브셸이 즉시 끝나 echo 까지 가지 못한다.
            # &&/|| 리스트 안의 명령은 errexit 대상에서 빠지므로 이 형태를 쓴다.
            rm -f ~/.deploy-fe.status

            { docker compose -f docker-compose-fe.yaml up -d --build 2>&1 \
                && echo ok > ~/.deploy-fe.status \
                || echo fail > ~/.deploy-fe.status; } | tee ~/deploy-fe.log

            if [ "$(cat ~/.deploy-fe.status 2>/dev/null)" != "ok" ]; then
              echo "image build failed — 서버의 ~/deploy-fe.log 에 전체 로그가 있다"
              free -h || true
              dmesg -T 2>/dev/null | grep -iE 'out of memory|killed process' | tail -20 || true
              exit 1
            fi

            docker image prune -f

            # BuildKit 캐시는 정리하지 않으면 계속 쌓여 디스크를 채운다.
            # 일주일치는 남겨 다음 빌드 속도를 지킨다.
            docker builder prune -f --filter until=168h

            # 기동 직후에는 아직 starting 일 수 있으므로 잠시 기다린다.
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Status}}' pskhome-fe-1 2>/dev/null || echo missing)
              if [ "$STATUS" = "running" ]; then break; fi
              sleep 2
            done

            if [ "$STATUS" != "running" ]; then
              echo "frontend container is '$STATUS'"
              docker logs --tail 200 pskhome-fe-1 || true

              # 컨테이너가 메모리 때문에 죽었는지 바로 구분할 수 있게 함께 남긴다.
              # dmesg 는 커널 설정에 따라 비특권 사용자에게 막혀 있을 수 있다.
              free -h || true
              dmesg -T 2>/dev/null | grep -iE 'out of memory|killed process' | tail -20 || true

              exit 1
            fi

            echo "frontend is running"
