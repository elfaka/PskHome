[project]
name = "trader"
version = "0.1.0"
description = "개인용 주식 자동매매 엔진 (1단계: 가상매매)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "pymysql>=1.1.1,<2",
  # MySQL 8 기본 인증(caching_sha2_password)을 비SSL 로 쓸 때 PyMySQL 이 필요로 한다
  "cryptography>=43",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  # Windows 에는 IANA 시간대 DB 가 없어 zoneinfo 가 Asia/Seoul 을 못 찾는다
  "tzdata>=2024.2",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "mysql: 로컬 MySQL 컨테이너가 필요한 테스트 (TRADER_TEST_DATABASE_URL 미설정 시 건너뜀)",
]
filterwarnings = ["error::DeprecationWarning:trader.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
# RUF001~003: 한글 주석/문자열의 전각 문자 경고는 끈다
# E501: 줄 길이는 formatter 가 맞춘다 (긴 문자열·SQL 만 남는다)
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trader"]
